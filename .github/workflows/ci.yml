name: Windows CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    # windows-2025 currently breaks WebView2 remote-debugging automation.
    # https://github.com/actions/runner-images/issues/14738
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Ensure Microsoft WebView2 runtime
        shell: pwsh
        run: |
          $keys = @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}')
          $runtime = $keys | ForEach-Object { (Get-ItemProperty -LiteralPath $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ -and $_ -ne '0.0.0.0' }
          if (!$runtime) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Microsoft Corporation*') { throw 'Invalid Microsoft runtime installer signature' }
            $process = Start-Process -FilePath $installer -ArgumentList '/silent','/install' -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -notin @(0,3010)) { throw "WebView2 installation failed: $($process.ExitCode)" }
          }
      - run: npm ci
      - run: npm test
      - run: npm run test:rust
      - run: npm run test:native-build
      - run: npm run test:desktop
      - name: Package production application without test hooks
        run: npm run package
      - name: Verify production executable
        shell: pwsh
        run: |
          $env:FOLIO_TEST_EXECUTABLE = (Resolve-Path src-tauri/target/release/folio.exe).Path
          node tests/production-smoke.cjs
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.sha }}
          path: |
            test-results/native/*.json
            test-results/native/*.png
            test-results/native/*.pdf
            test-results/native/*.log
            test-results/production/*.json
            test-results/production/*.png
          if-no-files-found: warn
          retention-days: 14
