name: Windows CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Select Rust toolchain
        run: rustup default stable
      - run: npm ci
      - run: npm test
      - run: npm run test:rust
      - run: npm run test:native-build
      - run: npm run test:desktop
      - name: Package production application without test hooks
        run: npm run package
      - name: Verify production executable
        shell: pwsh
        run: |
          $env:FOLIO_TEST_EXECUTABLE = (Resolve-Path src-tauri/target/release/folio.exe).Path
          node tests/production-smoke.cjs
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.sha }}
          path: |
            test-results/native/*.json
            test-results/native/*.png
            test-results/native/*.pdf
            test-results/production/*.json
            test-results/production/*.png
          if-no-files-found: warn
          retention-days: 14
