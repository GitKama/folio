[package]
name = "folio"
version = "2.0.0"
description = "Folio Markdown reader and editor"
authors = ["Alex"]
edition = "2021"
license = "MIT"
repository = "https://github.com/GitKama/folio"

[features]
custom-protocol = ["tauri/custom-protocol"]
test-harness = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
encoding_rs = "0.8"
tempfile = "3"
base64 = "0.22"
url = "2"
percent-encoding = "2"
rfd = "0.17"
open = "5"
reqwest = { version = "0.12", features = ["blocking"] }
clipboard-win = "5"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
